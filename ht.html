
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Notes</title>

<style>
:root {
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --bg: #f5f6fa;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --white: #ffffff;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
}

button, input, select, textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 30px 20px;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 25px;
}

header h1 {
    font-size: 30px;
    color: var(--primary);
}

.subtitle {
    color: var(--muted);
    margin-top: 4px;
}

.btn {
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-weight: 600;
    transition: 0.2s;
}

.btn-primary {
    background: var(--primary);
    color: white;
}

.btn-primary:hover {
    background: var(--primary-dark);
}

.btn-secondary {
    background: #eef2ff;
    color: var(--primary-dark);
}

.btn-danger {
    background: #fee2e2;
    color: #b91c1c;
}

.btn-small {
    padding: 6px 10px;
    font-size: 13px;
}

.panel {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 22px;
}

.panel-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

.panel-heading h2 {
    font-size: 19px;
}

.category-manager[hidden] {
    display: none;
}

.category-form {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
}

input, select, textarea {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    background: white;
    color: var(--text);
    outline: none;
}

input:focus, select:focus, textarea:focus {
    border-color: var(--primary);
}

.category-form input {
    flex: 1;
}

.category-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.category-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    padding: 11px 13px;
    background: #f9fafb;
    border: 1px solid var(--border);
    border-radius: 8px;
}

.category-name {
    font-weight: 600;
    overflow-wrap: anywhere;
}

.category-actions {
    display: flex;
    gap: 8px;
}

.filters {
    display: grid;
    grid-template-columns: 1fr 230px;
    gap: 12px;
    margin-bottom: 20px;
}

.notes-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
}

.note-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 210px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.03);
}

.note-card h3 {
    font-size: 18px;
    margin-bottom: 8px;
    overflow-wrap: anywhere;
}

.note-category {
    display: inline-block;
    width: fit-content;
    padding: 4px 9px;
    background: #eef2ff;
    color: var(--primary-dark);
    font-size: 12px;
    font-weight: 600;
    border-radius: 20px;
    margin-bottom: 12px;
}

.note-preview {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    color: #4b5563;
    font-size: 14px;
    flex: 1;
    max-height: 130px;
    overflow: hidden;
}

.note-preview ul, .note-preview ol {
    padding-left: 22px;
}

.note-preview h1, .note-preview h2 {
    font-size: 16px;
}

.note-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid #f0f0f0;
}

.note-actions button {
    flex: 1;
}

.empty-state {
    text-align: center;
    color: var(--muted);
    padding: 55px 20px;
    background: white;
    border: 1px dashed #d1d5db;
    border-radius: 12px;
    grid-column: 1 / -1;
}

.empty-state h3 {
    color: var(--text);
    margin-bottom: 8px;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(17, 24, 39, 0.55);
    padding: 20px;
    overflow-y: auto;
    align-items: center;
    justify-content: center;
}

.modal.active {
    display: flex;
}

.modal-content {
    background: white;
    width: 100%;
    max-width: 760px;
    border-radius: 14px;
    padding: 24px;
    max-height: 92vh;
    overflow-y: auto;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
}

.modal-header h2 {
    font-size: 23px;
}

.close-btn {
    border: none;
    background: transparent;
    font-size: 27px;
    color: var(--muted);
    line-height: 1;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    font-weight: 600;
    margin-bottom: 7px;
}

.formatting-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px;
    background: #f3f4f6;
    border: 1px solid var(--border);
    border-bottom: none;
    border-radius: 8px 8px 0 0;
}

.formatting-toolbar button {
    min-width: 38px;
    padding: 8px 12px;
    background: white;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 14px;
}

.formatting-toolbar button:hover {
    background: #e0e7ff;
}

.note-editor {
    width: 100%;
    min-height: 260px;
    padding: 15px;
    border: 1px solid #d1d5db;
    border-radius: 0 0 8px 8px;
    font-size: 16px;
    line-height: 1.7;
    overflow-wrap: anywhere;
    outline: none;
    background: white;
}

.note-editor:focus {
    border-color: var(--primary);
}

.note-editor:empty::before {
    content: attr(data-placeholder);
    color: #9ca3af;
    pointer-events: none;
}

.note-editor ul, .note-editor ol {
    padding-left: 25px;
}

.note-editor h2 {
    font-size: 23px;
    margin: 8px 0;
}

.note-editor p {
    margin-bottom: 8px;
}

.modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
}

.toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #111827;
    color: white;
    padding: 12px 20px;
    border-radius: 8px;
    z-index: 2000;
    display: none;
    max-width: calc(100% - 30px);
    text-align: center;
}

.toast.show {
    display: block;
}

@media (max-width: 850px) {
    .notes-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

@media (max-width: 600px) {
    .container {
        padding: 18px 12px;
    }

    header h1 {
        font-size: 25px;
    }

    .filters {
        grid-template-columns: 1fr;
    }

    .notes-grid {
        grid-template-columns: 1fr;
    }

    .category-form {
        flex-direction: column;
    }

    .modal-content {
        padding: 18px;
    }
}
    .header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
    }

    /* Smooth theme transition */
    body,
    .panel,
    .note-card,
    .empty-state,
    .modal-content,
    .category-item,
    .formatting-toolbar,
    .formatting-toolbar button,
    input,
    select,
    .note-editor {
        transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }
    /* Dark theme colors */
    body.dark-mode {
        --bg: #111827;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --border: #374151;
        --white: #1f2937;
        
        background: var(--bg);
        color: var(--text);
    }

    /* panels and cards */
    body.dark-mode .panel,
    body.dark-mode .note-card,
    body.dark-mode .empty-state,
    body.dark-mode .modal-content {
        background: #1f2937;
        color: #f3f4f6;
        border-color: #374151;
    }
    /* Category items */
    body.dark-mode .category-item {
        background: #111827;
        border-color: #374151;
    }

    body.dark-mode .category-name {
        color: #f3f4f6;
    }

    /* Inputs and Dropdowns */
    body.dark-mode input,
    body.dark-mode select,
    body.dark-mode textarea {
        background: #111827;
        color: #f3f4f6;
        border-color: #4b5563;
    }

    body.dark-mode input::placeholder {
        color: #9ca3af;
    }

    /* Note Editor */
    body.dark-mode .note-editor {
        background: #111827;
        color: #f3f4f6;
        border-color: #4b5563;
    }

    body.dark-mode .note-editor:focus {
        border-color: #818cf8;

    }

    body.dark-mode .note-editor:empty::before {
        color: #9ca3af;

    }
    /* Formatting toolbar */
    body.dark-mode .formatting-toolbar {
        background: #111827;
        border-color: #374151;
    }

    body.dark-mode .formatting-toolbar button {
        background: #1f2937;
        color: #f3f4f6;
        border-color: #4b5563;
    }

    body.dark-mode .formatting-toolbar button:hover {
        background: #374151;
    }

    /* Note text and headings */
    body.dark-mode .note-preview {
        color: #d1d5db;
    }

    body.dark-mode .note-card h3,
    body.dark-mode .empty-state h3,
    body.dark-mode .modal-header h2,
    body.dark-mode .form-group label {
        color: #f9fafb;
    }
    /* category labels */
    body.dark-mode .note-category {
        background: #312e81;
        color: #c7d2fe;

    }
    /* Secondary buttons */
    body.dark-mode .btn-secondary {
        background: #374151;
        color: #e5e7eb;
    }

    body.dark-mode .btn-secondary:hover {
        background: #4b5563;
    }
    /* Delete Buttons */
    body.dark-mode .btn-danger {
        backgorund: #7f1d1d;
        color: #fecaca;
    }

    /* Modal close Button */
    body.dark-mode .close-btn {
        color: #d1d5db;
    }

    /*note action divider */
    body.dark-mode .note-actions {
        border-top-color: #374151
    }

    /*empty state border */
    body.dark-mode .empty-state {
        border-color: #4b5563;
    }
    /* Category dropdown options */
    body.dark-mode option {
        background: #1f2937;
        color: #f3f4f6;
    }

    /* Mobile header layout */
    @media (max-width: 600px) {
        .header-actions {
            width: 100%;
        
        }
        .header-actions button {
            flex: 1;
        }
    }

</style>
</head>

<body>

<div class="container">

    <header>
        <div>
            <h1>📝 Smart Notes</h1>
            <p class="subtitle">Your personal space for learning and organizing notes.</p>
        </div>

        <div class="header-actions">
            <button 
                class="btn btn-secondary"
                id="themeToggle"
                onclick="toggleDarkMode()"
                aria-label="Switch to Dark Mode"
            >
                🌙 Dark Mode
            </button>

        <button class="btn btn-primary" onclick="openEditor()">
            + Create Note
        </button>
        </div>
    </header>

    <!-- CATEGORY MANAGER -->
    <section class="panel">
        <div class="panel-heading">
            <h2>📚 Manage Categories</h2>
            <button
                class="btn btn-secondary"
                id="toggleCategoriesBtn"
                onclick="toggleCategoryManager()"
                aria-expanded="false"
            >
                + Manage
            </button>
        </div>

        <div class="category-manager" id="categoryManager" hidden>
            <form class="category-form" id="categoryForm">
                <input
                    type="text"
                    id="newCategoryName"
                    placeholder="Enter a new category name..."
                    maxlength="50"
                    required
                >
                <button class="btn btn-primary" type="submit">
                    Add Category
                </button>
            </form>

            <div class="category-list" id="categoryList"></div>
        </div>
    </section>

    <!-- SEARCH AND FILTER -->
    <section class="filters">
        <input
            type="search"
            id="searchInput"
            placeholder="🔍 Search your notes..."
            oninput="renderNotes()"
        >

        <select id="categoryFilter" onchange="renderNotes()">
            <option value="all">All Categories</option>
        </select>
    </section>

    <!-- NOTES -->
    <section class="notes-grid" id="notesGrid"></section>

</div>

<!-- NOTE EDITOR MODAL -->
<div class="modal" id="editor" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
    <div class="modal-content">

        <div class="modal-header">
            <h2 id="editorTitle">Create a Note</h2>
            <button class="close-btn" onclick="closeEditor()" aria-label="Close">&times;</button>
        </div>

        <form id="noteForm">

            <div class="form-group">
                <label for="noteTitle">Note Title</label>
                <input
                    type="text"
                    id="noteTitle"
                    placeholder="Enter your note title..."
                    maxlength="150"
                    required
                >
            </div>

            <div class="form-group">
                <label for="noteCategory">Category</label>
                <select id="noteCategory" required></select>
            </div>

            <div class="form-group">
                <label>Note Content</label>

                <div class="formatting-toolbar">
                    <button type="button" onmousedown="keepEditorSelection(event)" onclick="formatText('bold')" title="Bold">
                        <b>B</b>
                    </button>

                    <button type="button" onmousedown="keepEditorSelection(event)" onclick="formatText('italic')" title="Italic">
                        <i>I</i>
                    </button>

                    <button type="button" onmousedown="keepEditorSelection(event)" onclick="formatText('underline')" title="Underline">
                        <u>U</u>
                    </button>

                    <button type="button" onmousedown="keepEditorSelection(event)" onclick="formatText('insertUnorderedList')" title="Bullet List">
                        • List
                    </button>

                    <button type="button" onmousedown="keepEditorSelection(event)" onclick="formatText('formatBlock', 'h2')" title="Heading">
                        H2
                    </button>

                    <button type="button" onmousedown="keepEditorSelection(event)" onclick="formatText('formatBlock', 'p')" title="Paragraph">
                        P
                    </button>
                </div>

                <div
                    id="noteContent"
                    class="note-editor"
                    contenteditable="true"
                    data-placeholder="Start writing your note..."
                    role="textbox"
                    aria-multiline="true"
                ></div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeEditor()">
                    Cancel
                </button>

                <button type="submit" class="btn btn-primary">
                    Save Note
                </button>
            </div>

        </form>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

// ===============================
// STORAGE AND DEFAULT CATEGORIES
// ===============================

const NOTES_KEY = "smartNotes";
const CATEGORIES_KEY = "smartNoteCategories";

const THEME_KEY = "smartNotesTheme";

//Apply the selected theme
function applyTheme(theme) {
    const isDark = theme === "dark";

    document.body.classList.toggle("dark-mode", isDark);

    const button = document.getElementById("themeToggle");

    if (button) {
        button.textContent = isDark ? "☀️ Light Mode" : "🌙 Dark Mode";

        button.setAttribute(
            "aria-label",
            isDark ? "Switch to light mode " : "Switch to dark mode"
        );
    }
}
//Switch b/w light mode nd dark mode 
function toggleDarkMode() {
    const isDark = document.body.classList.contains("dark-mode");

    const newTheme = isDark ? "light" : "dark";

    localStorage.setItem(THEME_KEY, newTheme);

    applyTheme(newTheme);
}
//load the saved theme
function loadTheme() {
    const savedTheme = localStorage.getItem(THEME_KEY) || "light";

    applyTheme(savedTheme);
}

const DEFAULT_CATEGORIES = [
    "PCM",
    "Computer Science",
    "English",
    "Exams & Revision",
    "Practical & Projects",
    "Competitive Exams",
    "General"
];

let notes = loadNotes();
let categories = loadCategories();
let editingNoteId = null;
let toastTimer = null;

function loadNotes() {
    try {
        const saved = JSON.parse(localStorage.getItem(NOTES_KEY) || "[]");

        if (!Array.isArray(saved)) return [];

        return saved.map(note => ({
            id: note.id || createId(),
            title: String(note.title || ""),
            content: String(note.content || ""),
            category: String(note.category || "General"),
            contentFormat: note.contentFormat === "html" ? "html" : "text",
            pinned: note.pinned === true
        }));
    } catch (error) {
        console.error("Could not load notes:", error);
        return [];
    }
}

function loadCategories() {
    try {
        const saved = JSON.parse(localStorage.getItem(CATEGORIES_KEY) || "null");

        if (Array.isArray(saved)) {
            const cleaned = saved
                .filter(item => typeof item === "string")
                .map(item => item.trim())
                .filter(Boolean);

            if (!cleaned.some(item => item.toLowerCase() === "general")) {
                cleaned.push("General");
            }

            return [...new Set(cleaned)];
        }
    } catch (error) {
        console.error("Could not load categories:", error);
    }

    return [...DEFAULT_CATEGORIES];
}

function saveNotes() {
    localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
}

function saveCategories() {
    localStorage.setItem(CATEGORIES_KEY, JSON.stringify(categories));
}

function createId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
}

// ===============================
// SAFE HTML HANDLING
// ===============================

function sanitizeHTML(html) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(String(html), "text/html");

    const allowedTags = new Set([
        "B", "STRONG", "I", "EM", "U",
        "P", "BR", "H2", "UL", "OL", "LI"
    ]);

    function cleanNode(node) {
        const children = Array.from(node.childNodes);

        for (const child of children) {
            if (child.nodeType === Node.ELEMENT_NODE) {
                cleanNode(child);

                if (!allowedTags.has(child.tagName)) {
                    child.replaceWith(...Array.from(child.childNodes));
                } else {
                    Array.from(child.attributes).forEach(attr => {
                        child.removeAttribute(attr.name);
                    });
                }
            } else if (
                child.nodeType !== Node.TEXT_NODE &&
                child.nodeType !== Node.COMMENT_NODE
            ) {
                child.remove();
            }
        }
    }

    cleanNode(doc.body);
    return doc.body.innerHTML;
}

function plainTextToHTML(text) {
    const paragraph = document.createElement("p");
    paragraph.textContent = String(text || "");
    return paragraph.innerHTML.replace(/\n/g, "<br>");
}

// ===============================
// CATEGORY MANAGEMENT
// ===============================

function toggleCategoryManager() {
    const manager = document.getElementById("categoryManager");
    const button = document.getElementById("toggleCategoriesBtn");

    const isHidden = manager.hidden;
    manager.hidden = !isHidden;

    button.textContent = isHidden ? "− Hide" : "+ Manage";
    button.setAttribute("aria-expanded", String(isHidden));
}

function renderCategoryDropdowns() {
    const filter = document.getElementById("categoryFilter");
    const noteCategory = document.getElementById("noteCategory");

    const currentFilter = filter.value || "all";
    const currentCategory = noteCategory.value;

    filter.innerHTML = "";
    noteCategory.innerHTML = "";

    const allOption = document.createElement("option");
    allOption.value = "all";
    allOption.textContent = "All Categories";
    filter.appendChild(allOption);

    categories.forEach(category => {
        const option1 = document.createElement("option");
        option1.value = category;
        option1.textContent = category;
        filter.appendChild(option1);

        const option2 = document.createElement("option");
        option2.value = category;
        option2.textContent = category;
        noteCategory.appendChild(option2);
    });

    filter.value = categories.includes(currentFilter) ? currentFilter : "all";

    noteCategory.value = categories.includes(currentCategory)
        ? currentCategory
        : "General";
}

function renderCategoryList() {
    const list = document.getElementById("categoryList");
    list.replaceChildren();

    categories.forEach(category => {
        const item = document.createElement("div");
        item.className = "category-item";

        const name = document.createElement("span");
        name.className = "category-name";
        name.textContent = category;

        const actions = document.createElement("div");
        actions.className = "category-actions";

        if (category.toLowerCase() !== "general") {
            const renameBtn = document.createElement("button");
            renameBtn.className = "btn btn-secondary btn-small";
            renameBtn.textContent = "Rename";
            renameBtn.onclick = () => renameCategory(category);

            const deleteBtn = document.createElement("button");
            deleteBtn.className = "btn btn-danger btn-small";
            deleteBtn.textContent = "Delete";
            deleteBtn.onclick = () => deleteCategory(category);

            actions.append(renameBtn, deleteBtn);
        } else {
            const protectedLabel = document.createElement("span");
            protectedLabel.className = "subtitle";
            protectedLabel.textContent = "Default";
            actions.appendChild(protectedLabel);
        }

        item.append(name, actions);
        list.appendChild(item);
    });
}

document.getElementById("categoryForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const input = document.getElementById("newCategoryName");
    const name = input.value.trim();

    if (!name) return;

    if (categories.some(category => category.toLowerCase() === name.toLowerCase())) {
        showToast("This category already exists.");
        return;
    }

    categories.push(name);
    saveCategories();
    renderCategoryDropdowns();
    renderCategoryList();

    input.value = "";
    showToast("Category added!");
});

function renameCategory(oldName) {
    const newName = prompt("Enter the new category name:", oldName);

    if (newName === null) return;

    const cleaned = newName.trim();

    if (!cleaned) {
        showToast("Category name cannot be empty.");
        return;
    }

    if (categories.some(category =>
        category.toLowerCase() === cleaned.toLowerCase() &&
        category !== oldName
    )) {
        showToast("A category with that name already exists.");
        return;
    }

    categories = categories.map(category =>
        category === oldName ? cleaned : category
    );

    notes = notes.map(note => ({
        ...note,
        category: note.category === oldName ? cleaned : note.category
    }));

    saveCategories();
    saveNotes();
    renderCategoryDropdowns();
    renderCategoryList();
    renderNotes();

    showToast("Category renamed!");
}

function deleteCategory(category) {
    if (category.toLowerCase() === "general") {
        showToast("General cannot be deleted.");
        return;
    }

    const confirmed = confirm(
        `Delete "${category}"? Notes in this category will be moved to General.`
    );

    if (!confirmed) return;

    categories = categories.filter(item => item !== category);

    notes = notes.map(note => ({
        ...note,
        category: note.category === category ? "General" : note.category
    }));

    saveCategories();
    saveNotes();
    renderCategoryDropdowns();
    renderCategoryList();
    renderNotes();

    showToast("Category deleted. Notes moved to General.");
}

// ===============================
// NOTE EDITOR
// ===============================

function openEditor(noteId = null) {
    editingNoteId = noteId;

    const titleInput = document.getElementById("noteTitle");
    const contentArea = document.getElementById("noteContent");
    const categorySelect = document.getElementById("noteCategory");
    const editorTitle = document.getElementById("editorTitle");

    renderCategoryDropdowns();

    if (noteId) {
        const note = notes.find(item => item.id === noteId);

        if (!note) {
            showToast("Note not found.");
            return;
        }

        editorTitle.textContent = "Edit Note";
        titleInput.value = note.title;
        categorySelect.value = categories.includes(note.category)
            ? note.category
            : "General";

        if (note.contentFormat === "html") {
            contentArea.innerHTML = sanitizeHTML(note.content);
        } else {
            contentArea.textContent = note.content;
        }
    } else {
        editorTitle.textContent = "Create a Note";
        titleInput.value = "";
        categorySelect.value = "General";
        contentArea.innerHTML = "";
    }

    document.getElementById("editor").classList.add("active");

    setTimeout(() => titleInput.focus(), 50);
}

function closeEditor() {
    document.getElementById("editor").classList.remove("active");
    editingNoteId = null;
}

function keepEditorSelection(event) {
    event.preventDefault();
}

function formatText(command, value = null) {
    const editor = document.getElementById("noteContent");
    editor.focus();

    document.execCommand(command, false, value);
}

document.getElementById("noteForm").addEventListener("submit", function(event) {
    event.preventDefault();
    saveNote();
});

function saveNote() {
    const title = document.getElementById("noteTitle").value.trim();
    const category = document.getElementById("noteCategory").value;
    const editor = document.getElementById("noteContent");

    const content = sanitizeHTML(editor.innerHTML);
    const plainText = editor.innerText.trim();

    if (!title) {
        showToast("Please enter a note title.");
        return;
    }

    if (!plainText) {
        showToast("Please enter some note content.");
        editor.focus();
        return;
    }

    if (!categories.includes(category)) {
        showToast("Please select a valid category.");
        return;
    }

    if (editingNoteId) {
        const index = notes.findIndex(note => note.id === editingNoteId);

        if (index !== -1) {
            notes[index] = {
                ...notes[index],
                title,
                category,
                content,
                contentFormat: "html"
            };
        }
    } else {
        notes.unshift({
            id: createId(),
            title,
            category,
            content,
            contentFormat: "html"
        });
    }

    saveNotes();
    renderNotes();
    closeEditor();

    showToast(editingNoteId ? "Note updated!" : "Note saved!");
}
function togglePin(noteId) {
    const note = notes.find(item => item.id === noteId);

    if (!note) {
        showToast("Note not Found.");
        return;
    }

    note.pinned = !note.pinned;

    saveNotes();
    renderNotes();
    showToast(note.pinned ? "📌 Note pinned!" : "Note unpinned.");
}

function deleteNote(noteId) {
    const confirmed = confirm("Are you sure you want to delete this note?");

    if (!confirmed) return;

    notes = notes.filter(note => note.id !== noteId);

    saveNotes();
    renderNotes();

    showToast("Note deleted.");
}

// ===============================
// DISPLAY NOTES
// ===============================

function renderNotes() {
    const grid = document.getElementById("notesGrid");
    const search = document.getElementById("searchInput").value
        .trim()
        .toLowerCase();

    const selectedCategory = document.getElementById("categoryFilter").value;

    const filteredNotes = notes.filter(note => {
        const matchesCategory =
            selectedCategory === "all" || note.category === selectedCategory;

        const searchableContent = note.contentFormat === "html"
            ? htmlToText(note.content)
            : note.content;

        const matchesSearch =
            note.title.toLowerCase().includes(search) ||
            searchableContent.toLowerCase().includes(search) ||
            note.category.toLowerCase().includes(search);

        return matchesCategory && matchesSearch;
    });

    filteredNotes.sort((a,b) => {
        return Number(b.pinned) - Number(a.pinned);
    });

    grid.replaceChildren();

    if (filteredNotes.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";

        const heading = document.createElement("h3");
        heading.textContent = notes.length === 0
            ? "No notes yet"
            : "No matching notes";

        const message = document.createElement("p");
        message.textContent = notes.length === 0
            ? "Create your first note to get started."
            : "Try a different search or category.";

        empty.append(heading, message);
        grid.appendChild(empty);
        return;
    }

    filteredNotes.forEach(note => {
        const card = document.createElement("article");
        card.className = "note-card";

        const title = document.createElement("h3");
        title.textContent = note.title;

        const category = document.createElement("span");
        category.className = "note-category";
        category.textContent = note.category;

        const preview = document.createElement("div");
        preview.className = "note-preview";

        if (note.contentFormat === "html") {
            preview.innerHTML = sanitizeHTML(note.content);
        } else {
            preview.textContent = note.content;
        }

        const actions = document.createElement("div");
        actions.className = "note-actions";
        const pinBtn = document.createElement("button");
        pinBtn.className = "btn btn-secondary btn-small";
        pinBtn.textContent = note.pinned ? "📌 Unpin" : "📌 Pin";
        pinBtn.title = note.pinned ? "Unpin this note" : "Pin this note";

        pinBtn.onclick = () => togglePin(note.id);

        const editBtn = document.createElement("button");
        editBtn.className = "btn btn-secondary btn-small";
        editBtn.textContent = "Edit";
        editBtn.onclick = () => openEditor(note.id);

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "btn btn-danger btn-small";
        deleteBtn.textContent = "Delete";
        deleteBtn.onclick = () => deleteNote(note.id);

        actions.append(pinBtn,editBtn, deleteBtn);
        card.append(title, category, preview, actions);

        grid.appendChild(card);
    });
}

function htmlToText(html) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(sanitizeHTML(html), "text/html");
    return doc.body.textContent || "";
}

// ===============================
// TOAST NOTIFICATIONS
// ===============================

function showToast(message) {
    const toast = document.getElementById("toast");

    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
        toast.classList.remove("show");
    }, 2500);
}

// ===============================
// INITIALIZE APP
// ===============================

function initializeApp() {
    saveCategories();

    // Ensure every note has a valid category.
    notes = notes.map(note => ({
        ...note,
        category: categories.includes(note.category)
            ? note.category
            : "General"
    }));

    saveNotes();

    renderCategoryDropdowns();
    renderCategoryList();
    renderNotes();
}

document.getElementById("editor").addEventListener("click", function(event) {
    if (event.target === this) {
        closeEditor();
    }
});

document.addEventListener("keydown", function(event) {
    if (event.key === "Escape") {
        closeEditor();
    }
});
loadTheme();
initializeApp();
</script>
